# Apache Virtual Host Configuration for StudentHub Portal
# File: practical-15/apache_vhost.conf
#
# INTERMEDIATE EXTENSION:
# Configure a dedicated local domain (e.g. http://studenthub.local) pointing
# directly to the project directory in XAMPP Apache.

<VirtualHost *:80>
    ServerAdmin webmaster@studenthub.local
    DocumentRoot "C:/xampp/htdocs/25CS044_WDF_PROJECT-main"
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    <Directory "C:/xampp/htdocs/25CS044_WDF_PROJECT-main">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        # Enable index.html or index.php as default landing page
        DirectoryIndex index.html index.php

        # UTF-8 Encoding
        AddDefaultCharset UTF-8
    </Directory>

    # Dedicated Logging
    ErrorLog "logs/studenthub-error.log"
    CustomLog "logs/studenthub-access.log" combined
</VirtualHost>

# =============================================================================
# INSTRUCTIONS FOR LOCAL DEPLOYMENT:
# 1. Open C:\Windows\System32\drivers\etc\hosts in Notepad as Administrator.
# 2. Append the following entry:
#    127.0.0.1    studenthub.local
# 3. Include this virtual host block in C:\xampp\apache\conf\extra\httpd-vhosts.conf:
#    Include "C:/xampp/htdocs/25CS044_WDF_PROJECT-main/practical-15/apache_vhost.conf"
# 4. Restart Apache from XAMPP Control Panel.
# 5. Access the site in your browser at: http://studenthub.local
# =============================================================================
