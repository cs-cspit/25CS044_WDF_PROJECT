<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events | StudentHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/event.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border, #cbd5e1);
            background: var(--surface, #ffffff);
            color: var(--text, #1e293b);
            font-size: 0.92rem;
            outline: none;
        }

        :where(html.dark) .filter-bar input,
        :where(html.dark) .filter-bar select,
        :where(body.dark) .filter-bar input,
        :where(body.dark) .filter-bar select {
            background: #1e293b;
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .filter-bar input {
            flex: 1;
            min-width: 220px;
        }

        .status-msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 0.92rem;
        }

        .status-msg.loading {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .status-msg.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-technical { background: #e0f2fe; color: #0369a1; }
        .badge-sports { background: #dcfce7; color: #15803d; }
        .badge-cultural { background: #fce7f3; color: #be185d; }
        .badge-workshop { background: #fef3c7; color: #b45309; }
        .badge-career { background: #ede9fe; color: #6d28d9; }

        .status-pill {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .status-open { background: #dcfce7; color: #166534; }
        .status-upcoming { background: #fef3c7; color: #854d0e; }
        .status-closed { background: #fee2e2; color: #991b1b; }

        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            padding: 6px 14px;
            border: 1px solid var(--border, #cbd5e1);
            background: var(--surface, #ffffff);
            color: var(--text, #1e293b);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .page-btn.active {
            background: #0a66ff;
            color: #ffffff;
            border-color: #0a66ff;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="logo">
        <h2>StudentHub</h2>
    </div>
    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="attendance.html">Attendance</a></li>
        <li><a href="timetable.html">Timetable</a></li>
        <li><a href="fees.html">Fees</a></li>
        <li><a href="subject-information.html">Subjects</a></li>
        <li><a href="leave-application.html">Leave</a></li>
        <li><a href="event-entry.html" class="active">Events</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="address.html">Address</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="logout.html">Logout</a></li>
    </ul>
</div>

<div class="main">
    <div class="topbar">
        <h1>Campus Events (JSON Fetch & Dynamic UI)</h1>
    </div>

    <div id="event-status" class="status-msg"></div>

    <div class="card">
        <!-- Search, Filter & Sort Controls -->
        <div class="filter-bar">
            <input type="text" id="event-search" placeholder="🔍 Search event, venue or organizer...">
            <select id="event-category" aria-label="Filter category">
                <option value="all">All Categories</option>
                <option value="Technical">Technical</option>
                <option value="Sports">Sports</option>
                <option value="Cultural">Cultural</option>
                <option value="Workshop">Workshop</option>
                <option value="Career">Career</option>
            </select>
            <select id="event-sort" aria-label="Sort events">
                <option value="date-asc">Date: Earliest First</option>
                <option value="date-desc">Date: Latest First</option>
                <option value="name-asc">Name: A to Z</option>
                <option value="name-desc">Name: Z to A</option>
                <option value="seats-desc">Seats: Highest First</option>
            </select>
        </div>

        <!-- Dynamic Events Table -->
        <table>
            <thead>
                <tr>
                    <th scope="col">Event & ID</th>
                    <th scope="col">Category</th>
                    <th scope="col">Date</th>
                    <th scope="col">Venue</th>
                    <th scope="col">Capacity</th>
                    <th scope="col">Status</th>
                </tr>
            </thead>
            <tbody id="events-tbody">
                <!-- Dynamically populated from data/events.json -->
            </tbody>
        </table>

        <!-- Dynamic Pagination -->
        <div id="event-pagination" class="pagination-container"></div>
    </div>
</div>

<script src="../js/events-manager.js"></script>
</body>
</html>
