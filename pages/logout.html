<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logout</title>

    <script>

        function logoutUser(){

            let choice = confirm("Are you sure you want to logout?");

            if(choice){

                window.location.href="../index.html";

            }
            else{

                window.history.back();

            }

        }

    </script>

</head>

<body onload="logoutUser()">

</body>

</html>
