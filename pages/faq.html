<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | StudentHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/public-pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .faq-controls {
            max-width: 820px;
            margin: 0 auto 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .faq-controls input,
        .faq-controls select {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border, #cbd5e1);
            background: var(--surface, #ffffff);
            color: var(--text, #1e293b);
            font-size: 0.95rem;
            outline: none;
        }

        .faq-controls input {
            flex: 1;
            min-width: 240px;
        }

        .faq-tag {
            font-size: 0.76rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(10, 102, 255, 0.1);
            color: var(--primary, #0a66ff);
            font-weight: 500;
            margin-left: 8px;
        }

        .status-msg {
            max-width: 820px;
            margin: 0 auto 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            font-size: 0.92rem;
        }

        .status-msg.loading { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
        .status-msg.error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header>
        <div class="logo">
            <img src="../images/logo.png" alt="StudentHub logo">
            <div>
                <h2>StudentHub</h2>
                <p>Academic Information System</p>
            </div>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="faq.html" aria-current="page">FAQ</a>
            <a href="contact.html">Contact</a>
            <a href="registration.html">Register</a>
            <a href="../index.html#login">Login</a>
        </nav>
    </header>

    <main id="main-content">
        <section class="page-hero">
            <h1>Frequently Asked Questions</h1>
            <p>Search & browse academic, fees, events, and account guidelines</p>
        </section>

        <nav class="breadcrumb container" aria-label="Breadcrumb">
            <a href="../index.html">Home</a> &rsaquo; FAQ
        </nav>

        <section class="content-section faq">
            <div class="container">
                <!-- Search & Category Filters -->
                <div class="faq-controls">
                    <input type="text" id="faq-search" placeholder="🔍 Search question or keyword...">
                    <select id="faq-category" aria-label="Filter category">
                        <option value="all">All Topics</option>
                        <option value="Academic">Academic</option>
                        <option value="Fees">Fees</option>
                        <option value="Account">Account</option>
                        <option value="Examination">Examination</option>
                        <option value="Events">Events</option>
                        <option value="Support">Support</option>
                    </select>
                </div>

                <div id="faq-status" class="status-msg"></div>

                <!-- Dynamic FAQ List (Loaded from data/faqs.json) -->
                <div class="faq-list"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <h3>StudentHub</h3>
            <p>Empowering Students Through Technology</p>
            <p>&copy; 2026 StudentHub</p>
        </div>
    </footer>

    <script src="../js/faq.js"></script>
</body>
</html>
